name: Deploy production

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to deploy (branch, tag, or commit SHA)
        required: true
        default: main
        type: string
      confirm_production:
        description: Confirm deployment to the production domain
        required: true
        default: false
        type: boolean

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: inputs.confirm_production == true
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Check out requested revision
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Install Vercel CLI
        run: npm install --global vercel@56.4.1

      - name: Pull production environment
        run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Build production artifact
        run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy production artifact
        id: deploy
        shell: bash
        run: |
          deployment_url="$(vercel deploy --prebuilt --prod --yes --token="${{ secrets.VERCEL_TOKEN }}")"
          echo "url=${deployment_url}" >> "$GITHUB_OUTPUT"
          echo "### Production deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "${deployment_url}" >> "$GITHUB_STEP_SUMMARY"

      # A deployment that succeeded is not the same as a site that answers, and this
      # project has been caught by the difference more than once: a green commit status
      # can belong to a Preview while the production domain still serves the build
      # before it. So ask the production domain itself, by name, and print what it says.
      - name: Smoke-test the production domain
        shell: bash
        run: |
          set -euo pipefail
          base="https://glory-map.vercel.app"
          status="$(curl -sS --max-time 30 -o /tmp/home.html -w '%{http_code}' "$base/")"
          echo "GET / -> ${status}"
          test "${status}" = "200"
          for page in "/directory" "/directory/films/s"; do
            code="$(curl -sS --max-time 30 -o /dev/null -w '%{http_code}' "${base}${page}")"
            echo "GET ${page} -> ${code}"
            test "${code}" = "200"
          done
          for path in "/api/search?q=sky" "/api/cities/suggest?q=lond" "/api/directory/films?letter=s"; do
            echo "--- GET ${path}"
            curl -sS --max-time 30 -o /tmp/probe.json -w 'status %{http_code} in %{time_total}s\n' "${base}${path}"
            head -c 700 /tmp/probe.json
            echo
          done
